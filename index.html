<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Greenify NYC</title>
  <link rel="icon" href="assets/leaf-mascot.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- ============ Landing ============ -->
  <section id="landing" class="landing">
    <div class="landing-card">
      <div class="brand brand-lg">
        <!-- Logo: a tilted maple leaf with "greenify" set in a band cut through it. Inline so it can use the page's script font. -->
        <svg class="logo" viewBox="-2750 -2550 5500 5000" aria-hidden="true">
          <defs>
            <linearGradient id="logoLeaf" x1="0" y1="-2100" x2="0" y2="2100" gradientUnits="userSpaceOnUse">
              <stop offset="0" stop-color="#b5e889"/>
              <stop offset="1" stop-color="#5cbf63"/>
            </linearGradient>
            <!-- The band cut out of the leaf for the word to sit in. -->
            <mask id="logoBand" maskUnits="userSpaceOnUse" x="-3000" y="-3000" width="6000" height="6000">
              <rect x="-3000" y="-3000" width="6000" height="6000" fill="#fff"/>
              <rect x="-3000" y="-430" width="6000" height="640" rx="0" fill="#000" transform="rotate(-6)"/>
            </mask>
          </defs>
          <!-- Soft, rounded maple leaf: a thick same-color stroke with round joins rounds off every tip. -->
          <g mask="url(#logoBand)">
            <g transform="rotate(-16)">
              <path d="m-90 2030 45-863a95 95 0 0 0-111-98l-859 151 116-320a65 65 0 0 0-20-73l-941-762 212-99a65 65 0 0 0 34-79l-186-572 542 115a65 65 0 0 0 73-38l105-247 423 454a65 65 0 0 0 111-57l-204-1052 327 189a65 65 0 0 0 91-27l332-652 332 652a65 65 0 0 0 91 27l327-189-204 1052a65 65 0 0 0 111 57l423-454 105 247a65 65 0 0 0 73 38l542-115-186 572a65 65 0 0 0 34 79l212 99-941 762a65 65 0 0 0-20 73l116 320-859-151a95 95 0 0 0-111 98l45 863z" fill="url(#logoLeaf)" stroke="url(#logoLeaf)" stroke-width="150" stroke-linejoin="round" stroke-linecap="round"/>
              <path d="M-60 1850 L-60 -1500 M-60 250 L-1350 -720 M-60 250 L1250 -720 M-60 900 L-1250 700 M-60 900 L1150 700" stroke="#fff" stroke-width="60" stroke-linecap="round" opacity=".5" fill="none"/>
            </g>
          </g>
          <!-- "greenify", about the leaf's width, set in the gap -->
          <text class="logo-word" x="0" y="95" text-anchor="middle" textLength="3200" lengthAdjust="spacingAndGlyphs" transform="rotate(-6)">greenify</text>
        </svg>
        <h1><span class="sr-only">Greenify: </span>NYC Green Space Planner</h1>
      </div>
      <p class="tagline">See every park, garden, street tree and natural area in a neighborhood. Then find the gaps and plan where new green space should go.</p>

      <form id="landing-form" class="zip-form" autocomplete="off">
        <label for="landing-zip" class="zip-label">Enter your NYC ZIP code</label>
        <div class="zip-row">
          <input id="landing-zip" name="zip" inputmode="numeric" pattern="\d{5}" maxlength="5" placeholder="e.g. 10027" required>
          <button type="submit">Explore</button>
        </div>
        <p id="landing-error" class="form-error" role="alert"></p>
      </form>

      <div class="examples">
        <span>Try:</span>
        <button class="chip" data-zip="10027">10027 Harlem</button>
        <button class="chip" data-zip="11211">11211 Williamsburg</button>
        <button class="chip" data-zip="10451">10451 South Bronx</button>
        <button class="chip" data-zip="11375">11375 Forest Hills</button>
        <button class="chip" data-zip="10301">10301 St. George</button>
      </div>
    </div>
    <footer class="sources">
      Data: <a href="https://www.nycgovparks.org/about/data" target="_blank" rel="noopener">NYC Parks Open Data</a> ·
      <a href="https://naturalareasnyc.org/nyc-nature-map/" target="_blank" rel="noopener">NYC Nature Map / Forever Wild</a> ·
      <a href="https://www.nycgovparks.org/greenthumb" target="_blank" rel="noopener">GreenThumb</a> ·
      <a href="https://data.cityofnewyork.us/Environment/Air-Quality-and-Health-Impacts/c3uy-2p5r/about_data" target="_blank" rel="noopener">NYC Air Quality</a>
    </footer>
  </section>

  <!-- ============ Planner ============ -->
  <section id="planner" class="planner" hidden>
    <header class="topbar">
      <a href="#" id="home-link" class="brand brand-sm" aria-label="Greenify NYC home">
        <img src="assets/leaf-mascot.svg" alt="" class="brand-icon mascot">
        <span class="wordmark">greenify</span>
      </a>
      <nav class="tabs" role="tablist" aria-label="Views">
        <button type="button" role="tab" class="tab" data-tab="map" aria-selected="true">Map</button>
        <button type="button" role="tab" class="tab" data-tab="build" aria-selected="false">Build Ideas</button>
        <button type="button" role="tab" class="tab" data-tab="community" aria-selected="false">Community</button>
      </nav>
      <div class="topbar-right">
        <form id="top-form" class="zip-form zip-form-inline" autocomplete="off">
          <input id="top-zip" inputmode="numeric" pattern="\d{5}" maxlength="5" placeholder="ZIP code" aria-label="ZIP code" required>
          <button type="submit">Go</button>
        </form>
        <div id="account-area" class="account-area"></div>
      </div>
    </header>

    <div class="workspace" data-panel="map" role="tabpanel">
      <aside class="sidebar" id="sidebar">
        <div id="profile"></div>
      </aside>
      <div class="map-wrap">
        <div id="map"></div>
        <div id="map3d" class="map3d" hidden></div>
        <div id="map-loading" class="map-loading" hidden><span class="spinner"></span><span id="loading-text">Loading…</span></div>
        <button id="propose-btn" class="propose-btn" type="button">＋ Propose a green space</button>
        <div id="streetview" hidden>
          <div id="streetview-panorama"></div>
          <div id="streetview-message" class="streetview-message" role="status" hidden></div>
        </div>
        <div class="map-view-switch" role="group" aria-label="Map view">
          <button type="button" data-map-view="map" aria-pressed="true">Map</button>
          <button type="button" data-map-view="3d" aria-pressed="false">3D</button>
          <button type="button" data-map-view="street" aria-pressed="false">Street View</button>
        </div>
      </div>
    </div>

    <div class="workspace" data-panel="build" role="tabpanel" hidden>
      <aside class="sidebar advisor-panel" id="advisor-panel"></aside>
      <div class="map-wrap" id="advisor-wrap"><div id="advisor-map"></div><div id="advisor-map3d" class="map3d" hidden></div></div>
    </div>

    <div class="tab-panel" data-panel="community" role="tabpanel" hidden>
      <div id="community-panel"></div>
    </div>
  </section>

  <!-- Outside #planner so they also work on the landing page (e.g. password-reset links). -->
  <dialog id="community-dialog" class="dialog"></dialog>
  <dialog id="auth-dialog" class="dialog dialog-sm"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@7.2.0/turf.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/plants.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/map3d.js"></script>
  <script src="js/streetview.js"></script>
  <script src="js/advisor.js"></script>
  <script src="js/community.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
